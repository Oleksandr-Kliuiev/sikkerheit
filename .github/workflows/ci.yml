name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Standard validators
        run: python -m pip install --disable-pip-version-check "jsonschema[format-nongpl]" openapi-spec-validator
      - name: Validate the Development Package
        run: python -I development-package/scripts/validate_package.py
      - name: Generated C# catalog is current
        run: python -I tools/contracts/gen_csharp_catalog.py --check
      - name: Generated portal policy defaults are current
        run: python -I tools/contracts/gen_policy_defaults.py --check
      - name: No invisible or bidirectional characters in sources
        run: python -I tools/lint/check_source_text.py

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore with lock files
        run: dotnet restore Sikkerheit.slnx --locked-mode
      - name: Build
        run: dotnet build Sikkerheit.slnx --no-restore -c Release
      - name: Production bootstrap with synthetic settings (no Azure access)
        run: python3 -I tools/iac/check_startup.py --assembly src/Sikkerheit.Host/bin/Release/net10.0/Sikkerheit.Host.dll --negative-tests
      - name: Unit tests
        run: dotnet test --project tests/Sikkerheit.UnitTests --no-build -c Release
      - name: Agent tests (WP-09; the Windows layer is skipped here)
        run: dotnet test --project tests/Sikkerheit.Agent.Tests --no-build -c Release
      - name: Integration tests (PostgreSQL in a container)
        run: dotnet test --project tests/Sikkerheit.IntegrationTests --no-build -c Release
      - name: Shared queue profile (synthetic handlers, no Azure or Graph)
        run: python3 -I tools/load/run_queue_profile.py --no-build --report TestResults/queue-profile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-profile
          path: TestResults/queue-profile.json
          if-no-files-found: ignore
      - name: Contract tests, a negative test for every record of the invariant registry (WP-01)
        run: dotnet test --project tests/Sikkerheit.ContractTests --no-build -c Release

  agent-windows:
    # Smoke tests of the Windows layer of the agent (DPAPI, CNG, readers of facts). Not SP-04: no TPM, domain or third-party antivirus.
    # continue-on-error until the first real run on GitHub shows how the readers behave on the runner.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore with lock files
        run: dotnet restore tests/Sikkerheit.Agent.Tests --locked-mode
      - name: Build the agent
        run: dotnet build tests/Sikkerheit.Agent.Tests --no-restore -c Release
      - name: Agent tests including WindowsSmokeTests
        run: dotnet test --project tests/Sikkerheit.Agent.Tests --no-build -c Release

  rmm:
    # WP-11: the script of the RMM (INV-201) in PowerShell 7 and the static check of the MSI description. pwsh is on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of the PowerShell files
        shell: pwsh
        run: ./tools/rmm/Test-Syntax.ps1
      - name: Tests of the RMM script (negative cases of INV-201)
        shell: pwsh
        run: ./tools/rmm/tests/Run-RmmTests.ps1
      - name: Package.wxs agrees with the agent and the RMM script
        run: python3 -I tools/rmm/check_installer.py
      - name: The static check of the MSI fails on every broken rule
        run: python3 -I -m unittest discover -s tools/rmm/tests -p 'test_*.py'

  rmm-windows:
    # The same tests in Windows PowerShell 5.1 (the PowerShell of the RMM). Not SP-05: no signature, no msiexec, no RMM.
    # continue-on-error until the first real run shows how the runner behaves.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Syntax in Windows PowerShell 5.1
        shell: powershell
        run: ./tools/rmm/Test-Syntax.ps1
      - name: Tests of the RMM script in Windows PowerShell 5.1
        shell: powershell
        run: ./tools/rmm/tests/Run-RmmTests.ps1

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep CLI
        run: az bicep install
      - name: IaC check of the Bicep templates for prod and test (INV-081, INV-083, INV-085)
        run: python3 -I tools/iac/check_arm.py
      - name: IaC checks fail on deliberately broken templates
        run: python3 -I tools/iac/check_arm.py --self-test
      - name: Deployment scripts parse and pass shellcheck
        run: |
          for script in infra/scripts/*.sh tools/dev/*.sh; do bash -n "$script"; done
          shellcheck --severity=warning infra/scripts/*.sh tools/dev/*.sh tools/iac/tests/stubs/*
      - name: Offline tests of drill.sh, setup.sh and deploy-app.sh on the az stub
        run: python3 -I -m unittest discover -s tools/iac/tests

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Portal/package-lock.json
      - name: Install with the lock file
        run: npm ci --ignore-scripts
      - name: API types are generated from the current OpenAPI
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Lint (no dangerouslySetInnerHTML, no inline styles)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  atera-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline inventory reconciliation (synthetic Atera and Sikkerheit snapshots)
        run: python3 -I -m unittest discover -s tools/atera/tests
